spring.application.name=backend
server.port=8080

# PostgreSQL from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5433/cakes
spring.datasource.username=cakes_user
spring.datasource.password=cakes_pass

# Hibernate creates and updates the tables; data.sql then seeds the catalogue.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# AI cake designer (POST /api/ai/cake-art). The API key is read from the
# ANTHROPIC_API_KEY environment variable, never from this file.
anthropic.model=claude-opus-5-5
